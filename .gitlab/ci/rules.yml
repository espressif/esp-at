##############
# if anchors #
##############
.if-protected: &if-protected
  if: '($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_BRANCH =~ /^release\/v/ || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?($|-)/)'

.if-protected-or-web-trigger: &if-protected-or-web-trigger
  if: '($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_BRANCH =~ /^release\/v/ || $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?($|-)/ || $CI_PIPELINE_SOURCE == "web")'

.if-dev-push: &if-dev-push
  if: '$CI_COMMIT_REF_NAME != "master" && $CI_COMMIT_BRANCH !~ /^release\/v/ && $CI_COMMIT_TAG !~ /^v\d+\.\d+\.\d+(\.\d+)?($|-)/ && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web")'

.if-at-integration-merged-result: &if-at-integration-merged-result
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_EVENT_TYPE == "merged_result" || $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train")'

.if-at-integration-force-by-env: &if-at-integration-force-by-env
  if: '$ESP_AT_INTEGRATION_CI == "1"'

.if-at-integration-triggered-by-external: &if-at-integration-triggered-by-external
  if: '($CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && (($ATHENA_WEBLINK != null && $ATHENA_WEBLINK != "") || ($CASES != null && $CASES != "") || ($SUBMODULES != null && $SUBMODULES != "") || ($BUILD_TARGETS != null && $BUILD_TARGETS != ""))'

.if-at-integration-enabled-by-mr-note: &if-at-integration-enabled-by-mr-note
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_LABELS =~ /integration::(all\b|build_)/ || $CI_MERGE_REQUEST_LABELS =~ /ats_ci::debug/ || $CI_MERGE_REQUEST_DESCRIPTION =~ /\[ci-ats-debug\]/)'

############
# Patterns #
############
.patterns-docs: &patterns-docs
  - "docs/**/*"
  - "components/at/include/*"
  - ".gitlab/ci/build_docs.yml"
  - ".gitlab/ci/deploy.yml"
  - ".gitlab/ci/post_deploy.yml"

.patterns-src: &patterns-src
  - "bootloader_components/**/*"
  - "components/**/*"
  - "main/**/*"
  - "module_config/**/*"
  - "tools/**/*"
  - ".gitlab/**/*"
  - "patches/**/*"
  - ".gitlab-ci.yml"
  - "build.py"
  - "CMakeLists.txt"
  - "requirements.txt"

.patterns-examples: &patterns-examples
  - "examples/**/*"
  - "module_config/**/IDF_VERSION"

#########
# Rules #
#########
.rules:skip-at-integration:
  rules:
    - <<: *if-at-integration-force-by-env
      when: never
    - <<: *if-at-integration-triggered-by-external
      when: never
    - <<: *if-at-integration-enabled-by-mr-note
      when: never

.rules:protected:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected

.rules:build:build_doc:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected
    - <<: *if-dev-push
      changes: *patterns-docs

.rules:build:build_project:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected-or-web-trigger
    - <<: *if-dev-push
      changes: *patterns-src

.rules:build:build_examples:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected-or-web-trigger
    - <<: *if-dev-push
      changes: *patterns-examples

.rules:build:build_project_on_protected:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected-or-web-trigger

.rules:deploy:docs_preview:
  rules:
    - <<: *if-dev-push
      changes: *patterns-docs

.rules:deploy:docs_production:
  rules:
    - !reference [".rules:skip-at-integration", rules]
    - <<: *if-protected

.rules:test:at_integration_pipeline:
  rules:
    - <<: *if-at-integration-merged-result
      when: never
    - <<: *if-at-integration-force-by-env
    - <<: *if-at-integration-triggered-by-external
    - <<: *if-at-integration-enabled-by-mr-note
    - when: never
